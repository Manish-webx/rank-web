<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0868A0" />
      <stop offset="100%" stop-color="#054e78" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f7fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BAB44" />
      <stop offset="100%" stop-color="#4d8a2c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Brand Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Accent Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  
  <!-- Lightning Bolt Icon -->
  <path d="M35 8 L13 34 H29 L27 56 L49 30 H33 Z" fill="url(#boltGrad)" filter="url(#shadow)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Green Growth Dot -->
  <circle cx="50" cy="14" r="4.5" fill="url(#glowGrad)" stroke="#ffffff" stroke-width="1.5" />
</svg>
